[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moneygraph"
version = "0.1.0"
description = "Tyuin: explainable transaction graph investigation workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pandas>=2.2,<3",
  "pyarrow>=18,<25", "numpy>=2,<3", "scipy>=1.14,<2",
  "networkx>=3.4,<4", "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["moneygraph*"]

[tool.setuptools.package-data]
moneygraph = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
